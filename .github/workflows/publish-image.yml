name: Publish image

# Builds the fork's own image and pushes it to the public OCIR repository, so
# it can be pulled on personal devices with no login. Fork-only file. Upstream's
# own publish workflows (Docker Hub, npm) were removed from this fork: they need
# credentials that belong to paaatrick/playball. If upstream edits either file,
# a merge shows a modify/delete conflict; resolve it by keeping the deletion.
#
# Multi-platform (amd64 + arm64) in one manifest list. The default runner is
# arm64, so the amd64 leg is emulated under QEMU and is the slow part (npm ci).
#
# single_tag: only a moving `latest` is pushed. Nothing ever pulls a specific
# past build of a personal-device image, so a per-commit tag is pure
# accumulation. This is the whole retention policy: one tag, overwritten.
#
# The registry, namespace and repo name are Actions variables, not secrets, and
# have to stay that way: GitHub blanks a job output that contains secret
# material, which would empty docker-push's `image` output.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push supersedes an in-flight build; only the latest matters.
concurrency:
  group: publish-image
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  push:
    name: Build and push
    # Logs in to OCIR with a short-lived token from this job's GitHub OIDC identity, not a stored
    # credential (tnoff/terraform#180). OCI maps this repo's push to main to a user that may push
    # only this repo's OCIR repositories (terraform-admin ocir-pushers.tf).
    permissions:
      contents: read
      id-token: write
    uses: tnoff/github-workflows/.github/workflows/docker-push-oidc.yml@5a6f80dffddfa833301b438ec9b2052d7f2c24f2  # docker-push-oidc-v1.0.0
    with:
      oidc_exchange_domain_url: ${{ vars.OIDC_EXCHANGE_DOMAIN_URL }}
      oidc_exchange_client_id: ${{ vars.OIDC_EXCHANGE_CLIENT_ID }}
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME }}
      platform: linux/amd64,linux/arm64
      single_tag: true
    secrets:
      oidc_exchange_client_secret: ${{ secrets.OIDC_EXCHANGE_CLIENT_SECRET }}
      oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
