name: Build and Test

on:
  push:
    branches:
      - 'main'
  # Called from ci.yml on pull requests, so build-and-test reports through the
  # `CI result` aggregate. This replaces upstream's own `pull_request` trigger
  # (the one deliberate divergence from upstream in this file); a second trigger
  # would run the suite twice per PR.
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run build

      - run: npm test
