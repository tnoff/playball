# Fleet failure notifier. Fork-only file, copied from the fleet template.
#
# One file covers every workflow in this repo, including ones added later.
# workflow_run only fires for a copy of this file on the DEFAULT branch.
#
# Upstream's publish workflows are gated to paaatrick/playball, so on this fork
# they conclude `skipped`, not `failure`, and do not notify.
name: Notify on failure

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

# discord-notify.yml posts to a webhook and never touches the GitHub API.
permissions: {}

jobs:
  notify:
    # conclusion == 'failure' : completed also covers success/cancelled/skipped.
    # event != 'pull_request' : a PR reports its own failure in the checks list.
    # name != this workflow   : workflow_run chains, so a failed notifier would
    #                           otherwise notify about itself.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.name != 'Notify on failure'
    uses: tnoff/github-workflows/.github/workflows/discord-notify.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # discord-notify-v1.0.0
    with:
      # Without these every field would describe THIS run rather than the one
      # that failed -- a reusable workflow shares the caller's run context.
      source_run_url: ${{ github.event.workflow_run.html_url }}
      source_workflow: ${{ github.event.workflow_run.name }}
      source_branch: ${{ github.event.workflow_run.head_branch }}
      source_actor: ${{ github.event.workflow_run.actor.login }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
      message: >-
        Triggered by ${{ github.event.workflow_run.event }}. Nobody is watching
        a checks list for this one, which is why it is here.
    secrets:
      discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
