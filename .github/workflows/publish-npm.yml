name: Publish NPM Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    # Upstream's release pipeline: publishes the `playball` package to npm via
    # a trusted-publisher setup that belongs to paaatrick. This fork has no such
    # grant, so a v* tag here would fail. Gated so it concludes `skipped`.
    if: github.repository == 'paaatrick/playball'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm publish
